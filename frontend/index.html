<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="theme-color" content="#000000" />
    <title>SlopeMate — твоя линия</title>
    <link rel="icon" type="image/png" href="/rider.png" />
    <style>
      html,
      body {
        margin: 0;
        background: #000;
        color: #fff;
      }
      #first-paint {
        position: fixed;
        inset: 0;
        background: #000;
      }
      #first-paint img {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 136px;
        height: 136px;
        transform: translate(-50%, -50%);
      }
      #first-paint span {
        position: absolute;
        top: calc(50% + 90px);
        left: 0;
        right: 0;
        text-align: center;
        font:
          500 13px -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        letter-spacing: 2px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="first-paint" role="status" aria-label="SlopeMate загружается">
        <img src="/rider.png" alt="Сноубордист SlopeMate" /><span
          >SlopeMate</span
        >
      </div>
    </div>
    <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
